<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Game Price Checker</title>
  </head>
  <body>
    <div class="container">
      <div class="header-container">
        <h1 class="title-txt">Game Price Checker</h1>

        <div class="input-container">
          <input class="search-input" type="text" placeholder="Search Game" />
          <button class="search-btn btn-pink">Search</button>
        </div>
      </div>

      <!-- Welcome screen -->
      <div class="welcome-screen-container">
        <h1>Find the game you want to buy! 🎮</h1>
      </div>

      <!-- Search results -->
      <div class="search-result-container"></div>

      <!-- Deals -->
      <div class="deals-container">
        <div class="deals-header"></div>

        <div class="deals-list-container">
          <h3 class="deals-list-heading">List of Deals</h3>

          <div class="deals-wrapper"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
